
name: Deploy BagUI to VPS

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: bagui-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest

    environment:
      name: Production
      url: https://bagui.pro

    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy BagUI
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "sudo -n /usr/local/sbin/deploy-bagui.sh '$GITHUB_SHA'"
