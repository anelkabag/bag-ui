
name: Deploy BagUI to VPS (Production)

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: bagui-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest

    environment:
      name: Production
      url: https://bagui.pro

    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY_CI }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -e

          install -m 700 -d ~/.ssh

          printf '%s' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          echo "SSH configuration completed."

      - name: Verify SSH key
        run: |
          set -e

          echo "Checking SSH key..."
          ssh-keygen -y -f ~/.ssh/id_ed25519 | ssh-keygen -lf -

      - name: Deploy BagUI
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -e

          echo "Deploying commit: $GITHUB_SHA"

          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/id_ed25519 \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "sudo -n /bin/bash /usr/local/sbin/deploy-bagui.sh '$GITHUB_SHA'"

          echo "Deployment command completed successfully."
